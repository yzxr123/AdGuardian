name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Verify uploaded B4.3 source
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build.gradle
          test -f tools/fetch_vision_deps.sh
          test -f tools/validate_project.py
          test -f app/src/main/cpp/CMakeLists.txt
          grep -F "versionName '0.4.3-b4.3'" app/build.gradle
          grep -F "ndkVersion '29.0.14206865'" app/build.gradle
          echo "B4.3 source layout verified"

      - name: Bootstrap Android and build Debug APK
        id: assemble
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          {
            echo "===== AdGuardian B4.3 CI ====="
            echo "UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Commit: $GITHUB_SHA"
            echo "Java: $(java -version 2>&1 | head -1)"
            echo "Gradle: $(gradle --version | grep '^Gradle ' | head -1)"

            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            echo "===== Android SDK NDK CMake ====="
            "$SDKMANAGER" \
              "platforms;android-36" \
              "build-tools;35.0.0" \
              "ndk;29.0.14206865" \
              "cmake;3.22.1"

            echo "===== Vision dependencies ====="
            bash tools/fetch_vision_deps.sh

            echo "===== Project validation ====="
            python3 tools/validate_project.py

            echo "===== Gradle assembleDebug ====="
            gradle :app:assembleDebug \
              --no-daemon \
              --stacktrace \
              --console=plain
          } 2>&1 | tee dist/ci-build.log

      - name: Publish failure diagnostics
        if: failure()
        shell: bash
        run: |
          echo "### AdGuardian B4.3 build failure" >> "$GITHUB_STEP_SUMMARY"
          if [ -f dist/ci-build.log ]; then
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 300 dist/ci-build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Failure happened before the integrated build step produced a log" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          path: dist/ci-build.log
          if-no-files-found: ignore
          archive: false
          retention-days: 7

      - name: Run Debug lint diagnostics
        if: success()
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle :app:lintDebug \
            --no-daemon \
            --stacktrace \
            --console=plain \
            2>&1 | tee dist/lint-debug.log

      - name: Report lint diagnostics
        if: always() && steps.assemble.outcome == 'success'
        shell: bash
        run: |
          echo "### Lint diagnostics" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.lint.outcome }}" = "failure" ]; then
            echo "lintDebug reported diagnostics but did not block the test APK" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 160 dist/lint-debug.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "lintDebug passed" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Prepare APK
        if: success()
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk dist/AdGuardian-B4.3.apk

      - name: Report and enforce APK size
        if: success()
        shell: bash
        run: |
          APK="dist/AdGuardian-B4.3.apk"
          BYTES=$(stat -c%s "$APK")
          MIB=$(awk "BEGIN {printf \"%.3f\", $BYTES/1024/1024}")
          echo "APK size: $BYTES bytes ($MIB MiB)"
          echo "### APK size" >> "$GITHUB_STEP_SUMMARY"
          echo "AdGuardian-B4.3.apk: **$MIB MiB** ($BYTES bytes)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$BYTES" -gt 52428800 ]; then
            echo "APK exceeds the 50 MiB project size ceiling" >&2
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          path: dist/AdGuardian-B4.3.apk
          if-no-files-found: error
          archive: false
          retention-days: 7
