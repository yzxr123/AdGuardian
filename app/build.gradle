plugins {
    id 'com.android.application'
}

android {
    namespace 'org.adguardian.app'
    compileSdk 36
    ndkVersion '29.0.14206865'

    defaultConfig {
        applicationId 'org.adguardian.app'
        minSdk 30
        targetSdk 36
        versionCode 10
        versionName '0.4.3-b4.3'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    signingConfigs {
        development {
            storeFile rootProject.file('dev-signing.jks')
            storePassword 'adguardian-dev'
            keyAlias 'adguardian-dev'
            keyPassword 'adguardian-dev'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            signingConfig signingConfigs.development
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
}
